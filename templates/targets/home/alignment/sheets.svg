  <style type="text/css" id="sheets-style">/* As-built feather catalog. Presentation lives here; elements carry classes only. */
.outline { 
   stroke: #000000; 
   stroke-width: 0.25;
   stroke-dasharray: 2.5, 2.5;
}

/* a guide line and an overlay origin arrow are the same kind of stroke */
.guide,
.arrow {
  fill: none;
  stroke: #000000;
  stroke-width: 0.264583;
  stroke-linecap: butt;
  stroke-linejoin: miter;
}
.divider{
   fill:none;
   stroke:#000000;
   stroke-width:0.264583;
   stroke-linecap:butt;
   stroke-linejoin:miter;
   stroke-opacity:1;
}



.align .outline { fill: none; stroke: #000000; }

/* one marker, not twenty-eight; the head takes the path's stroke colour */



.mark { fill: #000000; stroke: none; }

/* the diagnostic overlay: hidden, read by nothing */
.align { opacity: 0.5; }

/* one colour per family, keyed on a class rather than an ancestor id */
.b .outline { fill: #8c564b; }
.p .outline { fill: #1f77b4; }
.pc .outline { fill: #d62728; }
.a .outline { fill: #2ca02c; }
.sc .outline { fill: #9467bd; }
.mc .outline { fill: #17becf; }
.lc .outline { fill: #bcbd22; }
.s .outline { fill: #ff7f0e; }

.cal     { stroke: #000000; stroke-width: 0.5; }
.minor   { stroke: #000000; stroke-width: 0.15; }
.major   { stroke: #000000; stroke-width: 0.5; }
.num     { font-family: sans-serif; fill: #000000; font-size: 3.5; text-anchor: middle; }
.caltext { font-family: sans-serif; fill: #000000; font-size: 6; text-anchor: middle; font-weight: bold; }


.outline { stroke: #000000; stroke-width: 0.5; fill: none; }
.guide { stroke: #000000; stroke-width: 0.264583; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.arrow { stroke: #000000; stroke-width: 0.264583; fill: none; stroke-linecap: butt; stroke-linejoin: miter; }
.mark { fill: #000000; stroke: none; }
.label { font-family: sans-serif; fill: #000000; text-anchor: middle; dominant-baseline: middle; font-size: 5; }
.title { font-family: sans-serif; fill: #000000; font-size: 9; text-anchor: middle; font-weight: bold; }
.note { font-family: sans-serif; fill: #555555; font-size: 4; text-anchor: middle; }
.cal { stroke: #000000; stroke-width: 0.5; }
.minor { stroke: #000000; stroke-width: 0.15; }
.major { stroke: #000000; stroke-width: 0.5; }
.num { font-family: sans-serif; fill: #000000; font-size: 3.5; text-anchor: middle; }
.caltext { font-family: sans-serif; fill: #000000; font-size: 6; text-anchor: middle; font-weight: bold; }
.crop { stroke: #999999; stroke-width: 0.25; }
.overlap { stroke: #999999; stroke-width: 0.15; stroke-dasharray: 2 2; fill: none; }
.note { font-family: sans-serif; fill: #555555; font-size: 4; text-anchor: middle; }

.sheet-bounds { fill: #ffffff; stroke: none; }
</style>
