  <style
     type="text/css"
     id="style1">
/* As-built feather catalog. Presentation lives here; elements carry classes only. */
.group {
  stroke: #000000;
  stroke-width: 0.5;
}
.label {
  font-family: sans-serif;
  font-size: 6px;
  fill: #000000;
  text-anchor: middle;
}
.outline {
  stroke: #000000;
}
.centerline {
  fill: none;
  stroke-width: 0.2646;
  stroke-linecap: butt;
  stroke-linejoin: miter;
}

/* P -- primaries */
.P .outline { fill: #1f77b4; }

/* S -- secondaries */
.S .outline { fill: #ff7f0e; }

/* A -- alula */
.A .outline { fill: #2ca02c; }

/* PC -- primary coverts */
.PC .outline { fill: #d62728; }

/* SC -- secondary coverts */
.SC .outline { fill: #9467bd; }

/* MC -- median coverts */
.MC .outline { fill: #17becf; }

/* LC -- lesser coverts */
.LC .outline { fill: #bcbd22; }

/* B -- body feathers */
.B .outline { fill: #8c564b; }

/* Visibility lines: where each feather passes under the ones in front of it,
   i.e. the edge of the part that is still exposed when the wing is assembled. */
.visibility-line {
  fill: none;
  stroke: #e41a1c;
  stroke-width: 0.264583;
  stroke-linecap: round;
  stroke-linejoin: round;
}
</style>
