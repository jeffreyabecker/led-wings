  <title
     id="title1">As-built feather templates - 42 feathers, 1:1 mm, vertical flip</title>
  <desc
     id="desc1">Aggregate of as-built/vectors/individuals/*.svg, one group per feather prefix. Each outline is copied verbatim from its individual file and only translated and mirrored (vertical) about its own centre, so it stays 1:1 (user units = mm) and keeps its label. Each feather's geometry now lives once in &lt;defs&gt; as a vertical definition (id + &quot;-def&quot;); the &lt;use&gt; that places it carries only the rotation the arrangement needs.</desc>
