<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PC1: one feather, broken out of feathers-aggregate-min.svg.
     The outline's coordinates are unchanged from the aggregate; they are only
     placed by this file's viewBox, which is the outline's bounding box plus
     1 mm of margin so the cut line's stroke is not clipped.
     The aggregate references this file with a <use> whose width/height match the
     viewBox exactly, which makes the viewBox-to-viewport mapping the identity and
     leaves the aggregate's own placement matrix as the only thing positioning it.
     Stroke only, as `.outline`: the fill is the aggregate's to state, not this
     file's. The group keeps its class because that is what the aggregate's
     `.P .outline { fill: ... }` rules select through. -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
    version="1.1"
    id="PC1"
    width="58.76447mm"
    height="126.5327mm"
    viewBox="385.22679 101.56089 58.76447 126.5327"
    inkscape:label="PC1">
  <title id="title-PC1">PC1 - single feather outline, 1:1 mm, no fill</title>
  <style
     type="text/css"
     id="style-PC1">
  .outline {
    stroke: #000000;
    stroke-width: 0.5;
    fill:none;
  }
  </style>
  <g
    id="PC1-def"
    class="group PC">
    <path
    id="PC1-outline"
    class="outline"
    d="M 437.26072 224.89217 L 386.68687 227.09359 C 386.22679 208.50667 387.96266 189.88973 391.03728 170.26715 C 392.42928 161.38615 394.68882 150.90288 398.03082 142.52988 C 400.34782 136.72588 413.52682 107.20793 417.47282 104.79793 C 419.28535 103.69175 425.065 102.56089 429.31388 112.08694 C 439.46188 130.38394 442.9911 147.92402 442.9911 168.83602 L 442.99126 172.331 C 442.99126 176.957 442.8059 181.67789 442.4739 186.29089 C 441.53761 199.30793 439.68485 212.15674 437.26072 224.89217 z " />
  </g>
</svg>
