<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- P2: one feather, broken out of feathers-aggregate-min.svg.
     The outline's coordinates are unchanged from the aggregate; they are only
     placed by this file's viewBox, which is the outline's bounding box plus
     1 mm of margin so the cut line's stroke is not clipped.
     The aggregate references this file with a <use> whose width/height match the
     viewBox exactly, which makes the viewBox-to-viewport mapping the identity and
     leaves the aggregate's own placement matrix as the only thing positioning it.
     Stroke only, as `.outline`: the fill is the aggregate's to state, not this
     file's. The group keeps its class because that is what the aggregate's
     `.P .outline { fill: ... }` rules select through. -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
    version="1.1"
    id="P2"
    width="75.5858mm"
    height="344.39168mm"
    viewBox="306.4652 172.328 75.5858 344.39168"
    inkscape:label="P2">
  <title id="title-P2">P2 - single feather outline, 1:1 mm, no fill</title>
  <style
     type="text/css"
     id="style-P2">
  .outline {
    stroke: #000000;
    stroke-width: 0.5;
        fill:none;
  }
  </style>
  <g
    id="P2-def"
    class="group P">
    <path
    d="m 371.971,313.509 c -3.692,-46.985 -5.28,-74.512 -24.644,-118.661 -2.254,-5.139 -3.715,-15.557 -10.43,-17.278 -16.549,-4.242 -25.877,73.896 -28.295,86.428 -1.1368,5.89706 4.59023,150.22246 4.56485,225.40107 1.71785,7.3013 2.32703,2.45077 4.19946,20.26062 16.56068,1.88132 28.08764,4.27412 53.39987,6.05999 1.0099,-3.59155 2.55146,-11.30658 3.89982,-16.68168 1.972,-7.865 1.744,-15.629 2.693,-23.553 3.692,-30.813 0.143,-52.898 -1.346,-83.082 -1.274,-25.813 -2.498,-51.619 -3.998,-77.402 -0.029,-0.497 -0.059,-1.989 -0.044,-1.492 z"
    id="P2-outline"
    sodipodi:nodetypes="cscccccccccc"
    class="outline" />
  </g>
</svg>
