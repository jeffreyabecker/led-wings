<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- SC4: one feather, broken out of feathers-aggregate-min.svg.
     The outline's coordinates are unchanged from the aggregate; they are only
     placed by this file's viewBox, which is the outline's bounding box plus
     1 mm of margin so the cut line's stroke is not clipped.
     The aggregate references this file with a <use> whose width/height match the
     viewBox exactly, which makes the viewBox-to-viewport mapping the identity and
     leaves the aggregate's own placement matrix as the only thing positioning it.
     Stroke only, as `.outline`: the fill is the aggregate's to state, not this
     file's. The group keeps its class because that is what the aggregate's
     `.P .outline { fill: ... }` rules select through. -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
    version="1.1"
    id="SC4"
    width="73.11066mm"
    height="150.06556mm"
    viewBox="570.40403 351.97214 73.11066 150.06556"
    inkscape:label="SC4">
  <title id="title-SC4">SC4 - single feather outline, 1:1 mm, no fill</title>
  <style
     type="text/css"
     id="style-SC4">
  .outline {
    stroke: #000000;
    stroke-width: 0.5;
    fill:none;
  }
  </style>
  <g
    id="SC4-def"
    class="group SC">
    <path
    id="SC4-outline"
    class="outline"
    inkscape:label="SC4-outline"
    d="M 589.20594 501.0377 L 621.6159 497.19604 C 622.06292 488.27144 622.61787 480.81118 624.18289 477.70528 C 636.17063 453.91457 642.51469 404.0511 622.08904 365.0201 C 614.76587 355.14502 607.84209 352.97214 596.10009 371.58716 C 580.27509 395.45916 571.40403 429.63297 574.83103 458.05497 C 575.37403 462.55897 576.43988 466.93993 577.57888 471.31993 C 577.78588 472.11493 578.19488 473.70689 578.19488 473.70689 C 580.65984 483.37858 584.28569 492.59386 589.20594 501.0377 z " />
  </g>
</svg>
