    width="209.48487mm"
    height="76.090112mm"
    viewBox="373.19895 41.142938 209.48487 76.090112"
    inkscape:label="B2">
  <title id="title-B2">B2 - single feather outline, 1:1 mm, no fill</title>
  <style
