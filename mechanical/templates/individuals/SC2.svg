<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- SC2: one feather, broken out of feathers-aggregate-min.svg.
     The outline's coordinates are unchanged from the aggregate; they are only
     placed by this file's viewBox, which is the outline's bounding box plus
     1 mm of margin so the cut line's stroke is not clipped.
     The aggregate references this file with a <use> whose width/height match the
     viewBox exactly, which makes the viewBox-to-viewport mapping the identity and
     leaves the aggregate's own placement matrix as the only thing positioning it.
     Stroke only, as `.outline`: the fill is the aggregate's to state, not this
     file's. The group keeps its class because that is what the aggregate's
     `.P .outline { fill: ... }` rules select through. -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
    version="1.1"
    id="SC2"
    width="50.42131mm"
    height="151.85843mm"
    viewBox="340.45199 336.97466 50.42131 151.85843"
    inkscape:label="SC2">
  <title id="title-SC2">SC2 - single feather outline, 1:1 mm, no fill</title>
  <style
     type="text/css"
     id="style-SC2">
  .outline {
    stroke: #000000;
    stroke-width: 0.5;
    fill:none;
  }
  </style>
  <g
    id="SC2-def"
    class="group SC">
    <path
    id="SC2-outline"
    class="outline"
    inkscape:label="SC2-outline"
    d="m 371.63706,487.83309 -25.77605,-5.96965 c -1.09372,-4.68328 -1.96691,-8.81342 -2.37307,-11.03422 -1.91658,-12.50043 -1.99465,-26.0529 -2.02995,-39.0303 -0.006,-17.004 1.24729,-42.24698 6.46329,-58.43598 7.28749,-16.53582 9.6741,-23.96032 18.51558,-30.62971 14.22863,-4.75857 22.06156,29.19168 23.03529,48.20582 0.40115,51.2668 -3.03056,62.40801 -17.83509,96.89404 z"
    sodipodi:nodetypes="cccccccc" />
  </g>
</svg>
