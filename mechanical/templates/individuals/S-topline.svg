<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- S-topline: one top line, broken out of individuals/outline-toplines.svg.
     The coordinates and the element's own transform are unchanged; this file's
     viewBox is the line's bounding box plus 1 mm of margin so the
     stroke is not clipped. outline-toplines.svg references this file with a <use>
     whose width/height match the viewBox, so its own group transform still places
     the line exactly where it used to. -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
    version="1.1"
    id="S-topline"
    width="165.532834mm"
    height="19.463414mm"
    viewBox="12.715869 1751.240734 165.532834 19.463414"
    inkscape:label="S-topline">
  <title id="title-S-topline">S-topline - single top line, 1:1 mm</title>
  <style
     type="text/css"
     id="style-S-topline">
  .outline {
    stroke: #000000;
    stroke-width: 0.5;
    fill:none;
  }
  </style>
  <g
    id="S-topline-def">
    <path
       style="display:inline;fill:none;stroke:#000000;stroke-width:0.241545px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"
       d="m 863.20611,265.20014 164.76869,7.32287"
       id="S-topline-outline"
       transform="matrix(0.98862708,-0.15036039,0.08713051,0.99841597,-862.78009,1634.7161)" />
  </g>
</svg>
