    version="1.1"
    id="LC3"
    width="39.24136mm"
    height="87.997267mm"
    viewBox="855.24724 54.703203 39.24136 87.997267"
    inkscape:label="LC3">
  <title id="title-LC3">LC3 - single feather outline, 1:1 mm, no fill</title>
  <style
     type="text/css"
     id="style-LC3">
  .outline {
